<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OurSQL 并发演示</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <i data-lucide="database" aria-hidden="true"></i>
      <span>OurSQL</span>
    </div>
    <div class="topbar-actions">
      <a class="button button-secondary" href="/performance.html">
        <i data-lucide="gauge" aria-hidden="true"></i>
        <span>性能实验室</span>
      </a>
      <a class="button button-secondary" href="/">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        <span>返回工作台</span>
      </a>
    </div>
  </header>

  <main class="concurrency-page">
    <section class="demo-header">
      <div>
        <p class="eyebrow">Concurrent SQL</p>
        <h1>并发 SQL 工作台</h1>
      </div>
    </section>

    <div id="concurrencyMessage" class="message-area" role="status"
         aria-live="polite"></div>
    <section id="sessionGrid" class="concurrent-session-grid"
             aria-label="并发 SQL 编辑器"></section>

    <div class="concurrency-run-bar">
      <label class="session-count-control" for="sessionCount">
        <span>并发数</span>
        <select id="sessionCount">
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </label>
      <button id="runConcurrentButton" class="button button-primary" type="button">
        <i data-lucide="play" aria-hidden="true"></i>
        <span>并发运行</span>
      </button>
    </div>
  </main>

  <script src="/assets/lucide/lucide.min.js"></script>
  <script src="/concurrency.js"></script>
</body>
</html>
