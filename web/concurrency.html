<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OurSQL 并发演示</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <i data-lucide="database" aria-hidden="true"></i>
      <span>OurSQL</span>
    </div>
    <div class="topbar-actions">
      <a class="button button-secondary" href="/">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        <span>返回工作台</span>
      </a>
      <button id="runDemoButton" class="button button-primary" type="button">
        <i data-lucide="play" aria-hidden="true"></i>
        <span>运行并发演示</span>
      </button>
    </div>
  </header>

  <main class="concurrency-page">
    <section class="demo-header">
      <div>
        <p class="eyebrow">Multi-session / Lock / Deadlock</p>
        <h1>并发能力演示</h1>
      </div>
      <div id="demoSummary" class="demo-summary">
        <span class="muted">等待运行</span>
      </div>
    </section>

    <div id="demoMessage" class="message-area" role="status" aria-live="polite"></div>
    <section id="scenarioList" class="scenario-list" aria-live="polite"></section>
  </main>

  <script src="/assets/lucide/lucide.min.js"></script>
  <script src="/concurrency.js"></script>
</body>
</html>
